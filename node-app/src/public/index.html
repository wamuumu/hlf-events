<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLF WEB UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar - Events -->
            <div class="col-md-3 sidebar-events">
                <div class="p-4">
                    <h4 class="mb-3">
                        <svg width="24" height="24" fill="currentColor" class="me-2" viewBox="0 0 16 16">
                            <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
                        </svg>
                        Events Monitor
                    </h4>
                    
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-sm btn-success" id="startListening">
                            <svg width="16" height="16" fill="currentColor" class="me-1" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                <path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/>
                            </svg>
                            Start
                        </button>
                        <button class="btn btn-sm btn-danger" id="stopListening" disabled>
                            <svg width="16" height="16" fill="currentColor" class="me-1" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                <path d="M5 6.5A1.5 1.5 0 0 1 6.5 5h3A1.5 1.5 0 0 1 11 6.5v3A1.5 1.5 0 0 1 9.5 11h-3A1.5 1.5 0 0 1 5 9.5v-3z"/>
                            </svg>
                            Stop
                        </button>
                        <button class="btn btn-sm btn-outline-light" id="clearEvents">Clear</button>
                    </div>

                    <div class="event-status-sidebar mb-3">
                        <span class="badge bg-secondary" id="eventStatus">Not listening</span>
                        <small class="d-block mt-2" id="eventCount">0 events</small>
                    </div>

                    <div class="events-container-sidebar" id="eventsContainer">
                        <div class="text-center text-muted py-4">
                            <small>No events yet</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 main-content">
                <div class="p-4">
                    <h1 class="mb-4">Blockchain Web UI</h1>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="create-tab" data-bs-toggle="tab" data-bs-target="#create" type="button">
                                Create Resource
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="query-tab" data-bs-toggle="tab" data-bs-target="#query" type="button">
                                Query Resources
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="mainTabsContent">
                        <!-- Query Tab -->
                        <div class="tab-pane fade show active" id="query" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Query Resources by Time Range</h5>
                                    <p class="text-muted">Retrieve blockchain resources within a specified time period</p>
                                    
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-5">
                                            <label class="form-label">Start Date/Time</label>
                                            <input type="datetime-local" class="form-control" id="startDate">
                                        </div>
                                        <div class="col-md-5">
                                            <label class="form-label">End Date/Time</label>
                                            <input type="datetime-local" class="form-control" id="endDate">
                                        </div>
                                        <div class="col-md-2 d-flex align-items-end">
                                            <button class="btn btn-secondary w-100" id="useCurrentTime">Use Now</button>
                                        </div>
                                    </div>

                                    <button class="btn btn-primary" id="queryBtn">
                                        <span class="spinner-border spinner-border-sm d-none" id="querySpinner"></span>
                                        Execute Query
                                    </button>
                                </div>
                            </div>

                            <div class="card mt-4" id="queryResults" style="display: none;">
                                <div class="card-body">
                                    <h5 class="card-title">Query Results</h5>
                                    <div id="resultsContainer"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Create Tab -->
                        <div class="tab-pane fade" id="create" role="tabpanel">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title">Create New Resource</h5>
                                    <p class="text-muted">Add a new resource to the blockchain</p>
                                    
                                    <form id="createResourceForm">
                                        <div class="mb-3">
                                            <label class="form-label">PID (Persistent Identifier)</label>
                                            <input type="text" class="form-control" id="pid" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">URI</label>
                                            <input type="text" class="form-control" id="uri" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">Hash</label>
                                            <input type="text" class="form-control" id="hash" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">Timestamp</label>
                                            <input type="datetime-local" class="form-control" id="timestamp" required>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label class="form-label">Owners (comma-separated)</label>
                                            <input type="text" class="form-control" id="owners" placeholder="owner1,owner2,owner3" required>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary">
                                            <span class="spinner-border spinner-border-sm d-none" id="createSpinner"></span>
                                            Create Resource
                                        </button>
                                    </form>

                                    <div class="alert alert-success mt-3 d-none" id="createSuccess"></div>
                                    <div class="alert alert-danger mt-3 d-none" id="createError"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
