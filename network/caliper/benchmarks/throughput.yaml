test:
  name: Fabric Throughput Benchmark
  description: Measure transaction throughput (TPS) in both write and read scenarios
  workers:
    type: local # Default is 'local', other can be 'docker' or 'kubernetes'
    number: 1 # Simulate 1 client concurrently
  rounds:
    - label: tx-throughput (write)
      description: High-volume transaction test for maximum TPS
      txNumber: 1000 # Total number of transactions to issue. Could be set also txDuration.
      rateControl:
        type: fixed-rate
        opts:
          tps: 100 # Target transactions per second
      workload:
        module: workloads/throughput.js
        arguments:
          contractName: cc-test
          operationType: write
    - label: query-throughput (read)
      description: High-volume query test for maximum TPS
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/throughput.js
        arguments:
          contractName: cc-test
          operationType: read

monitor:
  type: [docker, process]
  interval: 5
